name: Test

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/test.yml"
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=false"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create secrets.properties
        run: echo "COIN_API_KEY=${{ secrets.COIN_API_KEY }}" > secrets.properties

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      # app:shared's plain ktlintCheck aggregate pulls in compileKotlinIosArm64/
      # compileKotlinIosSimulatorArm64 as a task-graph dependency -- Kotlin/
      # Native's Apple targets can only compile on a macOS host (Apple's
      # toolchain isn't distributed for other platforms), so that always fails
      # on this ubuntu-latest runner regardless of code correctness. Verified
      # locally that compileKotlinIosArm64 itself compiles clean on macOS, and
      # that this explicit sub-task list has zero compile dependency (dry-run
      # showed every one of these as a standalone SKIPPED/lint-only task) --
      # :core:ktlintCheck's plain aggregate is unaffected by the same issue and
      # didn't need this treatment.
      - name: Run ktlint
        run: |
          ./gradlew :core:ktlintCheck \
            :app:shared:ktlintCommonMainSourceSetCheck \
            :app:shared:ktlintCommonTestSourceSetCheck \
            :app:shared:ktlintAndroidMainSourceSetCheck \
            :app:shared:ktlintDesktopMainSourceSetCheck \
            :app:shared:ktlintDesktopTestSourceSetCheck \
            :app:shared:ktlintWasmJsMainSourceSetCheck \
            :app:shared:ktlintWebMainSourceSetCheck \
            :app:shared:ktlintKotlinScriptCheck \
            :app:androidApp:ktlintCheck :app:desktopApp:ktlintCheck :app:webApp:ktlintCheck

      - name: Run unit tests
        run: ./gradlew :app:shared:desktopTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"